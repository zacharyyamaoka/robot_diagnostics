# robot-sdk declaration: the shared types this package's public API takes (consumes) and gives (produces),
# each with the symbols that are the contract. Checked against the code by robot_sdk's
# `python -m tools.sdk_graph check` (docs/graph-schema.md in github.com/zacharyyamaoka/robot_sdk).
schema = "robot-sdk-declaration/1"
role = "library"
layer = "checks"
one_line = "Diagnostics as pure functions: diagnose(config, data) -> Result"
summary = "Robot Diagnostics (RobotDx). Diagnostics as checks: a diagnostic = a metric + a threshold, with a registry, records (ROS `DiagnosticStatus` shape), roll-ups and ~33 stock checks: tracking and stop error, ISO 9283, frequency response, fidelity, coverage, feedback, health, camera, events. JTC diagnostics (`stock.jtc`): one causal per-tick monitor over target, command and measured state (ros2 JTC tolerances, command sent, tick timing, torque residual, blocked / contact / collision, servo timeout and fault), the same numbers live and on a replay. Stdlib-only core; the stock maths (numpy, robot_metrics, sim2real) is the `stock` extra, imported lazily. The io-diagnostics app (dashboard, device tree) uses it."
use_when = "Is this robot, joint or sensor healthy? Pass/fail checks on runs, health dashboards, turning a metric into an alarm. A joint trajectory controller's per-tick diagnostics and collision detection."

# Where to read more. github and pypi are required; the rest are what this package has.
[links]
github = "https://github.com/zacharyyamaoka/robot_diagnostics"
pypi = "https://pypi.org/project/robot-diagnostics/"

# robot_msgs reaches it only through the [stock] extra's private _robot_metrics adapter.
