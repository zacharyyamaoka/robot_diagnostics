# Publishes to PyPI when a version tag (v*) is pushed, through PyPI trusted publishing:
# no API token is stored anywhere. One-time setup on pypi.org: a "pending publisher" for
# project robot-diagnostics, owner zacharyyamaoka, repository robot_diagnostics, workflow publish.yml,
# environment pypi.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY uv pip (test.yml): uv run locks every extra, and robot-metrics / sim2real are not on PyPI yet
      - run: uv venv
      - run: uv pip install --no-sources '.[test]'
      - run: .venv/bin/python -m pytest -q
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --no-sources
      - run: uv publish --trusted-publishing always
